<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>HCC PHLF Risk Assessment</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --primary: #1e3d70;
    --primary-2: #2c5aa0;
    --primary-3: #3498db;
    --panel: #ffffff;
    --text: #2c3e50;
    --text-mute: #7f8c8d;
    --border: #e1e8ed;

    /* 四层风险色系 */
    --low: #16a085; --low-2: #1abc9c;         /* 绿 */
    --mod: #f1c40f; --mod-2: #f39c12;         /* 黄 */
    --high: #e67e22; --high-2: #d35400;       /* 橙 */
    --extreme: #c0392b; --extreme-2: #922b21; /* 红 */

    --shadow-sm: 0 1px 3px rgba(30,61,112,0.06);
    --shadow-md: 0 4px 12px rgba(30,61,112,0.08);
    --shadow-lg: 0 10px 25px rgba(30,61,112,0.12);
    --shadow-xl: 0 20px 40px rgba(30,61,112,0.15);
  }
  body {
    font-family: -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif;
    background: linear-gradient(180deg, #eef2f7 0%, #dde5ef 100%);
    min-height: 100vh; color: var(--text); line-height: 1.55;
  }
  .header {
    background: linear-gradient(135deg, var(--primary), var(--primary-2));
    color: white; padding: 22px 40px;
    box-shadow: var(--shadow-lg); position: relative; overflow: hidden;
  }
  .header::before {
    content: ''; position: absolute; top: -50%; right: -10%;
    width: 400px; height: 400px;
    background: radial-gradient(circle, rgba(255,255,255,0.08) 0%, transparent 70%);
  }
  .header-inner {
    display: flex; justify-content: space-between; align-items: center;
    max-width: 1280px; margin: 0 auto; position: relative; z-index: 1;
  }
  .header h1 { font-size: 22px; font-weight: 500; letter-spacing: 0.3px; }
  .lang-toggle {
    background: rgba(255,255,255,0.15); color: white;
    border: 1px solid rgba(255,255,255,0.35);
    padding: 8px 18px; border-radius: 22px;
    cursor: pointer; font-size: 14px; font-weight: 500;
    transition: all 0.2s;
  }
  .lang-toggle:hover {
    background: rgba(255,255,255,0.28);
    transform: translateY(-1px);
  }
  .container {
    max-width: 1280px; margin: 24px auto; padding: 0 24px;
    display: grid;
    grid-template-columns: minmax(440px, 5fr) minmax(440px, 7fr);
    gap: 22px; align-items: start;
  }
  @media (max-width: 900px) { .container { grid-template-columns: 1fr; } }

  .panel {
    background: var(--panel); border-radius: 14px;
    padding: 24px 26px; box-shadow: var(--shadow-md);
    border: 1px solid rgba(255,255,255,0.7);
    transition: box-shadow 0.25s;
  }
  .panel:hover { box-shadow: var(--shadow-lg); }
  .panel h3 {
    font-size: 16px; font-weight: 600; color: var(--primary);
    padding-bottom: 12px; margin-bottom: 18px;
    border-bottom: 2px solid #f0f4f8;
    display: flex; align-items: center; gap: 8px;
  }
  .panel h3::before {
    content: ''; width: 4px; height: 16px;
    background: linear-gradient(180deg, var(--primary-2), var(--primary-3));
    border-radius: 2px;
  }

  .section-label {
    font-size: 11px; font-weight: 600; color: var(--text-mute);
    text-transform: uppercase; letter-spacing: 1px;
    margin: 16px 0 10px 0;
    padding-bottom: 6px; border-bottom: 1px dashed #dce4ec;
  }
  .section-label:first-child { margin-top: 0; }

  .input-group { margin-bottom: 16px; }
  .input-label {
    font-size: 13px; font-weight: 500;
    color: var(--text); margin-bottom: 6px; display: block;
  }
  .input-row {
    display: grid; grid-template-columns: 85px 1fr;
    gap: 12px; align-items: center;
  }
  .input-row input[type="number"] {
    padding: 7px 8px; border: 1px solid var(--border);
    border-radius: 6px; font-size: 13.5px; font-weight: 500;
    text-align: center; background: #fafbfc;
    transition: all 0.2s; width: 100%; font-family: inherit;
  }
  .input-row input[type="number"]:focus {
    outline: none; border-color: var(--primary-3);
    background: white; box-shadow: 0 0 0 3px rgba(52,152,219,0.15);
  }
  .slider-wrap { position: relative; padding: 3px 0; }
  .input-row input[type="range"] {
    -webkit-appearance: none; appearance: none;
    width: 100%; height: 5px;
    background: #e1e8ed; border-radius: 3px;
    outline: none; cursor: pointer;
  }
  .input-row input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 16px; height: 16px; background: white;
    border: 3px solid var(--primary-2); border-radius: 50%;
    cursor: pointer;
    box-shadow: 0 2px 6px rgba(30,61,112,0.25);
    transition: all 0.15s;
  }
  .input-row input[type="range"]::-webkit-slider-thumb:hover {
    transform: scale(1.15);
    box-shadow: 0 3px 8px rgba(30,61,112,0.35);
  }
  .input-row input[type="range"]::-moz-range-thumb {
    width: 16px; height: 16px; background: white;
    border: 3px solid var(--primary-2); border-radius: 50%;
    cursor: pointer;
  }
  .hint {
    color: var(--text-mute); font-size: 11px;
    margin-top: 4px; margin-left: 97px;
  }

  select {
    width: 100%; padding: 9px 12px;
    border: 1px solid var(--border); border-radius: 6px;
    font-size: 13.5px; background: #fafbfc;
    font-family: inherit; cursor: pointer;
    transition: all 0.2s;
  }
  select:focus {
    outline: none; border-color: var(--primary-3);
    background: white; box-shadow: 0 0 0 3px rgba(52,152,219,0.15);
  }

  /* 自动计算框 - 带彩色分级 */
  .auto-box {
    padding: 10px 14px; border-radius: 6px;
    font-family: 'SF Mono', Consolas, monospace;
    font-size: 13.5px; font-weight: 600;
    display: flex; justify-content: space-between; align-items: center;
    box-shadow: inset 0 1px 2px rgba(0,0,0,0.05);
    margin-bottom: 4px;
    border-left: 4px solid #ccc;
    transition: all 0.25s;
  }
  .auto-box.grade-low {
    background: linear-gradient(135deg, #d5f5e3, #a9dfbf);
    border-left-color: var(--low);
    color: #0e6655;
  }
  .auto-box.grade-mid {
    background: linear-gradient(135deg, #fcf3cf, #f9e79f);
    border-left-color: var(--mod-2);
    color: #7d6608;
  }
  .auto-box.grade-high {
    background: linear-gradient(135deg, #fadbd8, #f5b7b1);
    border-left-color: var(--extreme);
    color: #7b241c;
  }
  .auto-box.grade-none {
    background: linear-gradient(135deg, #eef7f9, #dbeef2);
    border-left-color: var(--primary-2);
    color: var(--primary);
  }
  .auto-grade {
    background: white; padding: 2px 10px;
    border-radius: 10px; font-size: 11px;
    border: 1px solid rgba(0,0,0,0.1);
    font-weight: 500;
  }

  .btn-calc {
    background: linear-gradient(135deg, var(--primary), var(--primary-3));
    color: white; border: none;
    padding: 13px; width: 100%;
    font-size: 15px; font-weight: 600;
    border-radius: 8px; cursor: pointer;
    letter-spacing: 0.5px;
    box-shadow: 0 4px 12px rgba(30,61,112,0.25);
    transition: all 0.2s; margin-top: 8px;
  }
  .btn-calc:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(30,61,112,0.35);
  }
  .btn-calc:active { transform: translateY(0); }

  .disclaimer {
    text-align: center; color: var(--text-mute);
    font-size: 10.5px; margin-top: 14px;
  }

  /* 四层风险背景 */
  .risk-box {
    padding: 32px 28px; border-radius: 14px;
    text-align: center; color: white;
    margin-bottom: 18px;
    position: relative; overflow: hidden;
    box-shadow: var(--shadow-xl);
  }
  .risk-box::before {
    content: ''; position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: radial-gradient(circle at top right, rgba(255,255,255,0.2), transparent 60%);
  }
  .risk-low     { background: linear-gradient(135deg, var(--low), var(--low-2)); }
  .risk-mod     { background: linear-gradient(135deg, var(--mod), var(--mod-2)); }
  .risk-high    { background: linear-gradient(135deg, var(--high), var(--high-2)); }
  .risk-extreme { background: linear-gradient(135deg, var(--extreme), var(--extreme-2)); }
  .risk-prob {
    font-size: 52px; font-weight: 300;
    letter-spacing: -1.5px;
    text-shadow: 0 2px 8px rgba(0,0,0,0.15);
    position: relative; z-index: 1;
  }
  .risk-label {
    font-size: 17px; margin-top: 8px;
    font-weight: 500; letter-spacing: 0.3px;
    position: relative; z-index: 1;
  }
  .risk-ci {
    font-size: 12px; margin-top: 6px;
    opacity: 0.9; position: relative; z-index: 1;
  }
  .risk-def-btn {
    position: absolute; top: 12px; right: 14px;
    background: rgba(255,255,255,0.2);
    border: 1px solid rgba(255,255,255,0.3);
    color: white; font-size: 11px;
    padding: 4px 10px; border-radius: 12px;
    cursor: pointer; z-index: 2;
    transition: all 0.2s;
  }
  .risk-def-btn:hover { background: rgba(255,255,255,0.35); }

  /* 分级说明面板 */
  .tier-def-panel {
    background: #f8f9fa; padding: 16px 18px;
    border-radius: 8px; margin-top: -8px; margin-bottom: 18px;
    border: 1px solid #e5e9ef;
    font-size: 12.5px; line-height: 1.7;
  }
  .tier-def-panel h5 {
    font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px;
    color: var(--text-mute); margin-bottom: 10px; font-weight: 600;
  }
  .tier-def-row {
    display: grid; grid-template-columns: 90px 100px 1fr;
    gap: 12px; padding: 6px 0;
    border-bottom: 1px solid #ecf0f1;
  }
  .tier-def-row:last-child { border-bottom: none; }
  .tier-badge {
    display: inline-block; padding: 3px 10px; border-radius: 10px;
    font-size: 11px; font-weight: 500; color: white;
  }
  .tier-badge.low     { background: var(--low); }
  .tier-badge.mod     { background: var(--mod-2); }
  .tier-badge.high    { background: var(--high); }
  .tier-badge.extreme { background: var(--extreme); }

  /* 术式对比表 */
  .compare-table {
    width: 100%; border-collapse: collapse;
    font-size: 13px;
  }
  .compare-table th {
    background: #f4f6f9; color: var(--text-mute);
    font-weight: 500; padding: 10px 12px;
    text-align: left; font-size: 11px;
    text-transform: uppercase; letter-spacing: 0.5px;
    border-bottom: 2px solid var(--border);
  }
  .compare-table td {
    padding: 12px; border-bottom: 1px solid #f0f4f8;
  }
  .compare-table tr.current {
    background: linear-gradient(90deg, rgba(52,152,219,0.08), transparent);
    border-left: 3px solid var(--primary-3);
    font-weight: 600;
  }
  .compare-table tr:hover:not(.current) { background: #fafbfc; }
  .delta {
    font-size: 11px; color: var(--text-mute); margin-left: 6px;
  }
  .delta.up { color: var(--extreme); font-weight: 600; }
  .delta.down { color: var(--low); font-weight: 600; }

  .advice-list { list-style: none; }
  .advice-list li {
    padding: 10px 0 10px 26px; position: relative;
    border-bottom: 1px solid #f4f6f9; font-size: 13.5px;
    transition: all 0.15s;
  }
  .advice-list li:last-child { border-bottom: none; }
  .advice-list li::before {
    content: '›'; position: absolute; left: 10px;
    color: var(--primary-3); font-weight: bold;
    font-size: 18px; top: 8px;
  }
  .advice-list li:hover { background: #fafbfc; padding-left: 30px; }

  .record-box {
    background: linear-gradient(180deg, #fafbfc, #f4f6f9);
    padding: 16px 18px; border-radius: 8px;
    font-family: 'SF Mono', Consolas, monospace;
    font-size: 12.5px; white-space: pre-wrap;
    line-height: 1.7;
    border-left: 4px solid var(--primary-3);
    color: var(--text);
  }

  .empty-state {
    text-align: center; padding: 80px 30px;
    color: var(--text-mute); font-size: 14px;
  }
  .empty-state-icon {
    font-size: 48px; opacity: 0.3;
    margin-bottom: 15px; display: block;
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-inner">
    <h1 id="title">HCC 术前 PHLF 风险评估与手术决策辅助系统</h1>
    <button class="lang-toggle" id="langBtn" onclick="toggleLang()">EN</button>
  </div>
</div>

<div class="container">
  <!-- Input panel -->
  <div class="panel">
    <h3 id="patientInfo">患者信息</h3>

    <div class="section-label" id="secReserve">肝功能储备指标</div>

    <div class="input-group">
      <label class="input-label" id="lblIcg">ICG-R15 (%)</label>
      <div class="input-row">
        <input type="number" id="icgNum" value="5" min="0" step="0.1">
        <div class="slider-wrap">
          <input type="range" id="icgSlider" value="5" min="0" max="50" step="0.1">
        </div>
      </div>
      <div class="hint" id="hintIcg">正常 &lt;10%, 临界 10-20%, 异常 &gt;20%</div>
    </div>

    <div class="input-group">
      <label class="input-label" id="lblAlb">白蛋白 (g/L)</label>
      <div class="input-row">
        <input type="number" id="albNum" value="40" min="0" step="0.1">
        <div class="slider-wrap">
          <input type="range" id="albSlider" value="40" min="15" max="60" step="0.1">
        </div>
      </div>
    </div>

    <div class="input-group">
      <label class="input-label" id="lblTbil">总胆红素 (μmol/L)</label>
      <div class="input-row">
        <input type="number" id="tbilNum" value="15" min="0" step="0.1">
        <div class="slider-wrap">
          <input type="range" id="tbilSlider" value="15" min="3" max="200" step="0.1">
        </div>
      </div>
    </div>

    <div class="input-group">
      <label class="input-label" id="lblAlbi">ALBI 评分 (自动)</label>
      <div class="auto-box grade-none" id="albiBox">
        <span id="albiValue">-2.279</span>
        <span class="auto-grade" id="albiGrade">Grade 2</span>
      </div>
    </div>

    <div class="section-label" id="secFibrosis">肝纤维化指标</div>

    <div class="input-group">
      <label class="input-label" id="lblAst">AST (U/L)</label>
      <div class="input-row">
        <input type="number" id="astNum" value="30" min="0" step="1">
        <div class="slider-wrap">
          <input type="range" id="astSlider" value="30" min="5" max="500" step="1">
        </div>
      </div>
    </div>

    <div class="input-group">
      <label class="input-label" id="lblAlt">ALT (U/L)</label>
      <div class="input-row">
        <input type="number" id="altNum" value="30" min="0" step="1">
        <div class="slider-wrap">
          <input type="range" id="altSlider" value="30" min="5" max="500" step="1">
        </div>
      </div>
    </div>

    <div class="input-group">
      <label class="input-label" id="lblPlt">血小板 PLT (×10⁹/L)</label>
      <div class="input-row">
        <input type="number" id="pltNum" value="180" min="0" step="1">
        <div class="slider-wrap">
          <input type="range" id="pltSlider" value="180" min="20" max="500" step="1">
        </div>
      </div>
    </div>

    <div class="input-group">
      <label class="input-label" id="lblFib4">FIB-4 (自动)</label>
      <div class="auto-box grade-none" id="fib4Box">
        <span id="fib4Value">1.60</span>
        <span class="auto-grade" id="fib4Grade">无明显纤维化</span>
      </div>
      <div class="hint" id="hintFib4" style="margin-left:0;">&lt;1.45 无明显纤维化, 1.45-3.25 中等, &gt;3.25 显著纤维化</div>
    </div>

    <div class="section-label" id="secBasic">基本信息与手术方案</div>

    <div class="input-group">
      <label class="input-label" id="lblAge">年龄 (岁)</label>
      <div class="input-row">
        <input type="number" id="ageNum" value="55" min="18" max="90" step="1">
        <div class="slider-wrap">
          <input type="range" id="ageSlider" value="55" min="18" max="90" step="1">
        </div>
      </div>
    </div>

    <div class="input-group">
      <label class="input-label" id="lblBmi">BMI (kg/m²)</label>
      <div class="input-row">
        <input type="number" id="bmiNum" value="23" min="0" step="0.1">
        <div class="slider-wrap">
          <input type="range" id="bmiSlider" value="23" min="14" max="45" step="0.1">
        </div>
      </div>
    </div>

    <div class="input-group">
      <label class="input-label" id="lblBclc">BCLC 分期</label>
      <select id="bclcSel">
        <option value="0/A">0 / A 期</option>
        <option value="B">B 期</option>
        <option value="C/D">C / D 期</option>
      </select>
    </div>

    <div class="input-group">
      <label class="input-label" id="lblSurg">拟行术式</label>
      <select id="surgSel">
        <option value="Minor">Minor - 楔形/局部/单段切除</option>
        <option value="Sectionectomy">Sectionectomy - 段/区切除</option>
        <option value="Major-Left/Central">Major-Left/Central - 左半肝/中肝</option>
        <option value="Major-Right">Major-Right - 右半肝 (最高危)</option>
      </select>
    </div>

    <button class="btn-calc" id="btnCalc" onclick="calculate()">计算风险</button>
    <div class="disclaimer" id="disclaimer">本工具仅供临床参考, 不替代医生决策</div>
  </div>

  <!-- Result panel -->
  <div id="resultPanel">
    <div class="panel">
      <div class="empty-state">
        <span class="empty-state-icon">📋</span>
        <div id="promptEmpty">请在左侧输入患者信息, 然后点击"计算风险"</div>
      </div>
    </div>
  </div>
</div>

<script>
const MODEL = {
  intercept: 0.300628456,
  beta_icg1: 0.006652289, beta_icg2: 0.031729303,
  beta_albi: 0.435198853, beta_fib4: 0.481806512,
  beta_bmi:  -0.070678259,
  beta_surg_Sect:  -0.019566102,
  beta_surg_MajorL: 0.097506088,
  beta_surg_MajorR: 0.885314457,
  beta_bclc_B:     0.604808058,
  beta_bclc_CD:    0.669510439,
  knots: [0.42, 4.30, 11.40],

  // ★ 四层切点 (基于本院592例数据的四分位数标定)
  cutLow: 0.077,      // Q1: ≤7.7% 低风险 (n=148, 实际率8.1%)
  cutMod: 0.113,      // Q2: 7.7-11.3% 中风险 (n=148, 实际率7.4%)
  cutHigh: 0.175,     // Q3: 11.3-17.5% 高风险 (n=148, 实际率13.5%)
                      // >17.5% 极高风险 (n=148, 实际率29.7%)
  vcov: [
    [ 1.513874,-0.016802, 0.013981, 0.255805,-0.064806,-0.028889,-0.050389,-0.035567,-0.031450,-0.045062,-0.044192],
    [-0.016802, 0.006915,-0.007356,-0.000296,-0.002752,-0.000210, 0.002501, 0.002532, 0.000308,-0.002269, 0.001081],
    [ 0.013981,-0.007356, 0.008301,-0.001428, 0.001775, 0.000156,-0.002455,-0.003037, 0.000344, 0.002380,-0.000985],
    [ 0.255805,-0.000296,-0.001428, 0.092758,-0.010644, 0.000556,-0.005621, 0.002773,-0.003657,-0.010749,-0.005736],
    [-0.064806,-0.002752, 0.001775,-0.010644, 0.039021, 0.000802,-0.006184,-0.000958, 0.000123,-0.002988,-0.007315],
    [-0.028889,-0.000210, 0.000156, 0.000556, 0.000802, 0.001333, 0.000174, 0.000483,-0.000177, 0.000327, 0.000612],
    [-0.050389, 0.002501,-0.002455,-0.005621,-0.006184, 0.000174, 0.135726, 0.027243, 0.025933, 0.001056, 0.005712],
    [-0.035567, 0.002532,-0.003037, 0.002773,-0.000958, 0.000483, 0.027243, 0.168369, 0.027518,-0.004105,-0.005962],
    [-0.031450, 0.000308, 0.000344,-0.003657, 0.000123,-0.000177, 0.025933, 0.027518, 0.112848,-0.013449,-0.030052],
    [-0.045062,-0.002269, 0.002380,-0.010749,-0.002988, 0.000327, 0.001056,-0.004105,-0.013449, 0.139061, 0.025824],
    [-0.044192, 0.001081,-0.000985,-0.005736,-0.007315, 0.000612, 0.005712,-0.005962,-0.030052, 0.025824, 0.147210]
  ]
};

function rcsExpand(x, knots) {
  const k = knots, n = k.length;
  const kn = k[n-1], k1 = k[0];
  const scale = Math.pow(kn - k1, 2);
  const pc = (u) => u > 0 ? Math.pow(u, 3) : 0;
  const t1 = x;
  const t2 = (pc(x - k[0])
              - pc(x - k[n-2]) * (kn - k[0]) / (kn - k[n-2])
              + pc(x - k[n-1]) * (kn - k[0]) / (kn - k[n-2])
              ) / scale;
  return [t1, t2];
}

function buildX(icg, albi, log_fib4, bmi, surg, bclc) {
  const [t1, t2] = rcsExpand(icg, MODEL.knots);
  const x = [1, t1, t2, albi, log_fib4, bmi];
  x.push(surg === 'Sectionectomy' ? 1 : 0);
  x.push(surg === 'Major-Left/Central' ? 1 : 0);
  x.push(surg === 'Major-Right' ? 1 : 0);
  x.push(bclc === 'B' ? 1 : 0);
  x.push(bclc === 'C/D' ? 1 : 0);
  return x;
}

const BETA = [
  MODEL.intercept, MODEL.beta_icg1, MODEL.beta_icg2,
  MODEL.beta_albi, MODEL.beta_fib4, MODEL.beta_bmi,
  MODEL.beta_surg_Sect, MODEL.beta_surg_MajorL, MODEL.beta_surg_MajorR,
  MODEL.beta_bclc_B, MODEL.beta_bclc_CD
];

function predict(icg, albi, log_fib4, bmi, surg, bclc) {
  const x = buildX(icg, albi, log_fib4, bmi, surg, bclc);
  let lp = 0;
  for (let i = 0; i < 11; i++) lp += x[i] * BETA[i];
  let seSq = 0;
  for (let i = 0; i < 11; i++) {
    for (let j = 0; j < 11; j++) {
      seSq += x[i] * MODEL.vcov[i][j] * x[j];
    }
  }
  const se = Math.sqrt(Math.max(seSq, 0));
  const plogis = v => 1/(1+Math.exp(-v));
  return { prob: plogis(lp), ci_lo: plogis(lp-1.96*se), ci_hi: plogis(lp+1.96*se) };
}

// ★ 四层分级
function tierOf(prob) {
  if (prob <= MODEL.cutLow) return 'Low';
  if (prob <= MODEL.cutMod) return 'Moderate';
  if (prob <= MODEL.cutHigh) return 'High';
  return 'Extreme';
}

let currentLang = 'cn';
let hasCalculated = false;
let lastResult = null;
let showTierDef = false;

function L() { return I18N[currentLang]; }

function toggleLang() {
  currentLang = (currentLang === 'cn') ? 'en' : 'cn';
  applyLang();
}

function toggleTierDef() {
  showTierDef = !showTierDef;
  renderResult();
}

function applyLang() {
  const t = L();
  document.documentElement.lang = (currentLang === 'cn') ? 'zh' : 'en';
  document.getElementById('title').textContent = t.title;
  document.getElementById('langBtn').textContent = t.langBtn;
  document.getElementById('patientInfo').textContent = t.patientInfo;
  document.getElementById('secReserve').textContent = t.secReserve;
  document.getElementById('secFibrosis').textContent = t.secFibrosis;
  document.getElementById('secBasic').textContent = t.secBasic;
  document.getElementById('lblIcg').textContent = t.lblIcg;
  document.getElementById('hintIcg').innerHTML = t.hintIcg;
  document.getElementById('lblAlb').textContent = t.lblAlb;
  document.getElementById('lblTbil').textContent = t.lblTbil;
  document.getElementById('lblAlbi').textContent = t.lblAlbi;
  document.getElementById('lblAst').textContent = t.lblAst;
  document.getElementById('lblAlt').textContent = t.lblAlt;
  document.getElementById('lblPlt').textContent = t.lblPlt;
  document.getElementById('lblFib4').textContent = t.lblFib4;
  document.getElementById('hintFib4').innerHTML = t.hintFib4;
  document.getElementById('lblAge').textContent = t.lblAge;
  document.getElementById('lblBmi').textContent = t.lblBmi;
  document.getElementById('lblBclc').textContent = t.lblBclc;
  document.getElementById('lblSurg').textContent = t.lblSurg;
  document.getElementById('btnCalc').textContent = t.btnCalc;
  document.getElementById('disclaimer').textContent = t.disclaimer;

  const surgSel = document.getElementById('surgSel');
  const currentSurg = surgSel.value;
  surgSel.innerHTML = Object.entries(t.surgLabels).map(([k,v]) =>
    `<option value="${k}"${k===currentSurg?' selected':''}>${v}</option>`).join('');

  if (!hasCalculated) {
    document.getElementById('promptEmpty').textContent = t.promptEmpty;
  } else {
    renderResult();
  }
  updateAlbi();
  updateFib4();
}

function bindPair(numId, sliderId, callback) {
  const num = document.getElementById(numId);
  const slider = document.getElementById(sliderId);
  const updateBg = () => {
    const pct = ((slider.value - slider.min) / (slider.max - slider.min)) * 100;
    slider.style.background = `linear-gradient(to right, var(--primary-3) 0%, var(--primary-3) ${pct}%, #e1e8ed ${pct}%, #e1e8ed 100%)`;
  };
  num.addEventListener('input', () => {
    if (num.value === '' || isNaN(num.value)) return;
    const v = parseFloat(num.value);
    // 如果输入值超出滑条范围, 自动扩展滑条上限 (保持step一致)
    if (v > parseFloat(slider.max)) {
      slider.max = Math.ceil(v * 1.2);
    }
    if (v < parseFloat(slider.min)) {
      slider.min = Math.floor(v * 0.8);
    }
    slider.value = v;
    updateBg();
    if (callback) callback();
  });
  slider.addEventListener('input', () => {
    num.value = slider.value;
    updateBg();
    if (callback) callback();
  });
  updateBg();
}

// ALBI 自动 + 彩色分级
function computeAlbi() {
  const alb = parseFloat(document.getElementById('albNum').value);
  const tbil = parseFloat(document.getElementById('tbilNum').value);
  if (isNaN(alb) || isNaN(tbil) || alb <= 0 || tbil <= 0) return null;
  return Math.log10(tbil) * 0.66 + alb * (-0.085);
}
function updateAlbi() {
  const v = computeAlbi();
  const box = document.getElementById('albiBox');
  const val = document.getElementById('albiValue');
  const gr = document.getElementById('albiGrade');
  box.classList.remove('grade-low','grade-mid','grade-high','grade-none');
  if (v === null) {
    val.textContent = '—'; gr.textContent = '';
    box.classList.add('grade-none');
    return;
  }
  val.textContent = v.toFixed(3);
  const g = v <= -2.60 ? 1 : v <= -1.39 ? 2 : 3;
  gr.textContent = L().gradePrefix + g + L().grade;
  box.classList.add(g === 1 ? 'grade-low' : g === 2 ? 'grade-mid' : 'grade-high');
}

// FIB-4 自动 + 彩色分级
function computeFib4() {
  const age = parseFloat(document.getElementById('ageNum').value);
  const ast = parseFloat(document.getElementById('astNum').value);
  const alt = parseFloat(document.getElementById('altNum').value);
  const plt = parseFloat(document.getElementById('pltNum').value);
  if (isNaN(age) || isNaN(ast) || isNaN(alt) || isNaN(plt) ||
      alt <= 0 || plt <= 0) return null;
  return age * ast / (plt * Math.sqrt(alt));
}
function updateFib4() {
  const v = computeFib4();
  const box = document.getElementById('fib4Box');
  const val = document.getElementById('fib4Value');
  const gr = document.getElementById('fib4Grade');
  box.classList.remove('grade-low','grade-mid','grade-high','grade-none');
  if (v === null || !isFinite(v)) {
    val.textContent = '—'; gr.textContent = '';
    box.classList.add('grade-none');
    return;
  }
  val.textContent = v.toFixed(2);
  const t = L();
  if (v < 1.45)      { gr.textContent = t.fib4Low;  box.classList.add('grade-low'); }
  else if (v <= 3.25){ gr.textContent = t.fib4Mid;  box.classList.add('grade-mid'); }
  else               { gr.textContent = t.fib4High; box.classList.add('grade-high'); }
}

function calculate() {
  const albi = computeAlbi();
  const fib4 = computeFib4();
  if (albi === null || fib4 === null || fib4 <= 0) {
    document.getElementById('resultPanel').innerHTML =
      `<div class="panel"><div class="empty-state">${L().invalidInput}</div></div>`;
    return;
  }
  const icg = parseFloat(document.getElementById('icgNum').value);
  const age = parseFloat(document.getElementById('ageNum').value);
  const bmi = parseFloat(document.getElementById('bmiNum').value);
  const alb = parseFloat(document.getElementById('albNum').value);
  const tbil = parseFloat(document.getElementById('tbilNum').value);
  const bclc = document.getElementById('bclcSel').value;
  const surg = document.getElementById('surgSel').value;

  const log_fib4 = Math.log(fib4);
  const r = predict(icg, albi, log_fib4, bmi, surg, bclc);
  const tier = tierOf(r.prob);

  const surgOptions = ['Minor','Sectionectomy','Major-Left/Central','Major-Right'];
  const compare = surgOptions.map(s => {
    const p = predict(icg, albi, log_fib4, bmi, s, bclc);
    return { surg: s, prob: p.prob, tier: tierOf(p.prob), current: s === surg };
  });

  lastResult = { r, tier, icg, alb, tbil, albi, fib4, age, bmi,
                 bclc, surg, compare };
  hasCalculated = true;
  showTierDef = false;  // 每次新计算重置说明面板
  renderResult();
}

function tierClassOf(t) {
  return t === 'Low' ? 'risk-low' :
         t === 'Moderate' ? 'risk-mod' :
         t === 'High' ? 'risk-high' : 'risk-extreme';
}
function tierBadgeClassOf(t) {
  return t === 'Low' ? 'low' :
         t === 'Moderate' ? 'mod' :
         t === 'High' ? 'high' : 'extreme';
}
function tierLabelOf(t) {
  const l = L();
  return t === 'Low' ? l.tierLow :
         t === 'Moderate' ? l.tierMod :
         t === 'High' ? l.tierHigh : l.tierExtreme;
}
function adviceOf(t) {
  const l = L();
  return t === 'Low' ? l.adviceLow :
         t === 'Moderate' ? l.adviceMod :
         t === 'High' ? l.adviceHigh : l.adviceExtreme;
}

function renderResult() {
  if (!lastResult) return;
  const t = L();
  const { r, tier, icg, albi, fib4, age, bmi, bclc, surg, compare } = lastResult;
  const probPct = (r.prob * 100).toFixed(1);
  const ciLo = (r.ci_lo * 100).toFixed(1);
  const ciHi = (r.ci_hi * 100).toFixed(1);
  const tierLabel = tierLabelOf(tier);
  const advice = adviceOf(tier);

  const currentProb = compare.find(c => c.current).prob;
  const compareRows = compare.map(c => {
    const pct = (c.prob * 100).toFixed(1);
    const tCls = tierBadgeClassOf(c.tier);
    const tLabel = tierLabelOf(c.tier);
    let delta = '';
    if (!c.current) {
      const d = (c.prob - currentProb) * 100;
      const arrow = d > 0 ? '↑' : d < 0 ? '↓' : '→';
      const cls = d > 0 ? 'up' : d < 0 ? 'down' : '';
      delta = `<span class="delta ${cls}">${arrow} ${Math.abs(d).toFixed(1)}%</span>`;
    }
    return `<tr class="${c.current ? 'current' : ''}">
      <td>${t.surgLabels[c.surg]}</td>
      <td><strong>${pct}%</strong>${delta}</td>
      <td><span class="tier-badge ${tCls}">${tLabel}</span></td>
    </tr>`;
  }).join('');

  const recordText = t.recordTpl({
    prob: probPct, tier: tierLabel,
    icg, albi: albi.toFixed(3), fib4: fib4.toFixed(2),
    age, bmi, bclc, surgLabel: t.surgLabels[surg],
    adviceTitle: advice.title
  });

  // 分级定义面板
  const tierDefPanel = showTierDef ? `
    <div class="tier-def-panel">
      <h5>${t.tierDefTitle}</h5>
      <div class="tier-def-row">
        <span class="tier-badge low">${t.tierLow}</span>
        <span><strong>${t.tierDefLow[0]}</strong></span>
        <span>${t.tierDefLow[1]}</span>
      </div>
      <div class="tier-def-row">
        <span class="tier-badge mod">${t.tierMod}</span>
        <span><strong>${t.tierDefMod[0]}</strong></span>
        <span>${t.tierDefMod[1]}</span>
      </div>
      <div class="tier-def-row">
        <span class="tier-badge high">${t.tierHigh}</span>
        <span><strong>${t.tierDefHigh[0]}</strong></span>
        <span>${t.tierDefHigh[1]}</span>
      </div>
      <div class="tier-def-row">
        <span class="tier-badge extreme">${t.tierExtreme}</span>
        <span><strong>${t.tierDefExtreme[0]}</strong></span>
        <span>${t.tierDefExtreme[1]}</span>
      </div>
    </div>
  ` : '';

  document.getElementById('resultPanel').innerHTML = `
    <div class="risk-box ${tierClassOf(tier)}">
      <button class="risk-def-btn" onclick="toggleTierDef()">${t.defBtn}</button>
      <div class="risk-prob">${probPct}%</div>
      <div class="risk-label">${tierLabel} | ${t.resultLabel}</div>
      <div class="risk-ci">${t.ciLabel} ${ciLo}% - ${ciHi}%</div>
    </div>
    ${tierDefPanel}
    <div class="panel">
      <h3>${t.compareTitle}</h3>
      <table class="compare-table">
        <thead><tr>
          <th>${t.thSurg}</th><th>${t.thProb}</th><th>${t.thTier}</th>
        </tr></thead>
        <tbody>${compareRows}</tbody>
      </table>
    </div>
    <div class="panel">
      <h3>${t.adviceTitle}: ${advice.title}</h3>
      <ul class="advice-list">
        ${advice.items.map(it => `<li>${it}</li>`).join('')}
      </ul>
    </div>
    <div class="panel">
      <h3>${t.recordTitle}</h3>
      <div class="record-box">${recordText}</div>
    </div>
  `;
}

bindPair('icgNum','icgSlider');
bindPair('albNum','albSlider', updateAlbi);
bindPair('tbilNum','tbilSlider', updateAlbi);
bindPair('astNum','astSlider', updateFib4);
bindPair('altNum','altSlider', updateFib4);
bindPair('pltNum','pltSlider', updateFib4);
bindPair('ageNum','ageSlider', updateFib4);
bindPair('bmiNum','bmiSlider');
updateAlbi();
updateFib4();
</script>
